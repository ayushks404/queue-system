databases:
  - name: queue-db
    plan: free
    databaseName: queue_db
    user: queue_user

services:
  - type: keyvalue
    name: queue-redis
    plan: free
    ipAllowList: []

  - type: web
    name: queue-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: queue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: queue-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: worker
    name: queue-worker
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node dist/worker.js
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: queue-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false

  - type: web
    name: queue-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
